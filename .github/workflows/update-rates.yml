name: Update rates.json

# يحدّث ملف public/rates.json تلقائياً كل ساعة مجاناً عبر GitHub Actions.
# سعر الدولار مقابل الليرة الجديدة يُضبط من متغير المستودع USD_SYP_NEW (Settings → Variables).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rates.json
        env:
          USD_SYP_NEW: ${{ vars.USD_SYP_NEW }}
          SPREAD: ${{ vars.SPREAD }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const anchor = Number(process.env.USD_SYP_NEW || 115);
          const spread = Number(process.env.SPREAD || 0.01);
          const codes = { usd:'USD', eur:'EUR', sar:'SAR', aed:'AED', try:'TRY', egp:'EGP', mad:'MAD',
                          kwd:'KWD', qar:'QAR', jod:'JOD', gbp:'GBP', chf:'CHF', rub:'RUB', iqd:'IQD', lbp:'LBP' };
          const res = await fetch('https://open.er-api.com/v6/latest/USD');
          const data = await res.json();
          const file = JSON.parse(fs.readFileSync('public/rates.json', 'utf8'));
          const rates = file.rates || {};
          const put = (id, mid) => { rates[id] = { buy: +(mid*(1-spread)).toFixed(6), sell: +(mid*(1+spread)).toFixed(6) }; };
          put('usd', anchor);
          put('usdt', anchor);
          for (const [id, code] of Object.entries(codes)) {
            const perUsd = Number(data.rates?.[code]);
            if (id !== 'usd' && perUsd > 0) put(id, anchor / perUsd);
          }
          file.rates = rates;
          file.updatedAt = new Date().toISOString();
          fs.writeFileSync('public/rates.json', JSON.stringify(file, null, 2) + '\n');
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || git commit -m "chore: update rates.json"
          git pull --rebase origin main
          git push
