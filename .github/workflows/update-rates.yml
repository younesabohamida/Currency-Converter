name: Update rates.json

# يحدّث ملف public/rates.json تلقائياً كل ساعة مجاناً عبر GitHub Actions،
# بجلب الأسعار مباشرة من موقع "الليرة اليوم" (sp-today.com).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rates.json
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const SLUGS = {
            usd: 'us-dollar',
            eur: 'euro',
            sar: 'saudi_riyal',
            aed: 'emirati_dirham',
            try: 'turkish_lira',
            egp: 'egyptian_pound',
            mad: 'moroccan_dirham',
            kwd: 'kuwaiti_dinar',
            qar: 'qatari_riyal',
            jod: 'jordanian_dinar',
            gbp: 'british_pound',
            chf: 'swiss_franc',
            rub: 'russian_ruble',
            iqd: 'iraqi_dinar',
          };

          const file = JSON.parse(fs.readFileSync('public/rates.json', 'utf8'));
          const rates = file.rates || {};

          async function fetchRate(slug) {
            const res = await fetch(`https://sp-today.com/currency/${slug}`, {
              headers: { 'User-Agent': 'Mozilla/5.0 (compatible; RatesBot/1.0)' },
            });
            if (!res.ok) return null;
            const html = await res.text();
            // نشترط وجود فاصلة عشرية في الرقم (مثل 154.40) لتفادي التقاط
            // أرقام عشوائية من أكواد التصميم (مثل text-2xl) التي غالباً أرقام صحيحة بلا فاصلة.
            const buyMatch = html.match(/شراء[\s\S]{0,300}?(\d+\.\d{1,4})/);
            const sellMatch = html.match(/بيع[\s\S]{0,300}?(\d+\.\d{1,4})/);
            if (!buyMatch || !sellMatch) return null;
            const buy = Number(buyMatch[1]);
            const sell = Number(sellMatch[1]);
            if (!(buy > 0) || !(sell > 0)) return null;
            return { buy, sell };
          }

          for (const [id, slug] of Object.entries(SLUGS)) {
            try {
              const entry = await fetchRate(slug);
              if (entry) {
                rates[id] = entry;
                console.log(`OK ${id}: buy=${entry.buy} sell=${entry.sell}`);
              } else {
                console.log(`SKIP ${id}: تعذّر قراءة السعر، سيبقى القديم`);
              }
            } catch (e) {
              console.log(`ERROR ${id}: ${e.message}`);
            }
            await new Promise((r) => setTimeout(r, 800));
          }

          if (rates.usd) rates.usdt = { ...rates.usd };

          file.rates = rates;
          file.updatedAt = new Date().toISOString();
          fs.writeFileSync('public/rates.json', JSON.stringify(file, null, 2) + '\n');
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || git commit -m "chore: update rates.json"
          git pull --rebase origin main
          git push
