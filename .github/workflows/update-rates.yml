name: Update rates.json

# يحدّث ملف public/rates.json تلقائياً كل ساعة مجاناً عبر GitHub Actions،
# بجلب الأسعار مباشرة من موقع "الليرة اليوم" (sp-today.com).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rates.json
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          // كل قيمة يمكن أن تكون مساراً واحداً أو قائمة مسارات بديلة تُجرَّب بالترتيب
          const SLUGS = {
            usd: ['us-dollar', 'dollar', 'usd', 'us_dollar'],
            eur: 'euro',
            sar: 'saudi_riyal',
            aed: 'emirati_dirham',
            try: 'turkish_lira',
            egp: 'egyptian_pound',
            mad: 'moroccan_dirham',
            kwd: 'kuwaiti_dinar',
            qar: 'qatari_riyal',
            jod: 'jordanian_dinar',
            gbp: 'british_pound',
            chf: 'swiss_franc',
            rub: 'russian_ruble',
            iqd: 'iraqi_dinar',
          };

          const file = JSON.parse(fs.readFileSync('public/rates.json', 'utf8'));
          const rates = file.rates || {};

          async function fetchHtml(url) {
            const res = await fetch(url, {
              headers: { 'User-Agent': 'Mozilla/5.0 (compatible; RatesBot/1.0)' },
            });
            if (!res.ok) {
              console.log(`  (HTTP ${res.status} على ${url})`);
              return null;
            }
            return res.text();
          }

          function extractBuySell(html) {
            if (!html) return null;
            const buyMatch = html.match(/شراء[\s\S]{0,300}?([\d,]+\.\d{1,4})/);
            const sellMatch = html.match(/بيع[\s\S]{0,300}?([\d,]+\.\d{1,4})/);
            if (!buyMatch || !sellMatch) return null;
            const buy = Number(buyMatch[1].replace(/,/g, ''));
            const sell = Number(sellMatch[1].replace(/,/g, ''));
            if (!(buy > 0) || !(sell > 0)) return null;
            return { buy, sell };
          }

          async function fetchRateWithFallback(slugs) {
            const list = Array.isArray(slugs) ? slugs : [slugs];
            for (const slug of list) {
              const html = await fetchHtml(`https://sp-today.com/currency/${slug}`);
              const entry = extractBuySell(html);
              if (entry) return entry;
              await new Promise((r) => setTimeout(r, 400));
            }
            return null;
          }

          for (const [id, slugs] of Object.entries(SLUGS)) {
            try {
              const entry = await fetchRateWithFallback(slugs);
              if (entry) {
                rates[id] = entry;
                console.log(`OK ${id}: buy=${entry.buy} sell=${entry.sell}`);
              } else {
                console.log(`SKIP ${id}: تعذّر قراءة السعر، سيبقى القديم`);
              }
            } catch (e) {
              console.log(`ERROR ${id}: ${e.message}`);
            }
            await new Promise((r) => setTimeout(r, 800));
          }

          try {
            const html = await fetchHtml('https://sp-today.com/gold/21k/syp');
            const entry = extractBuySell(html);
            if (entry) {
              rates.gold21 = entry;
              console.log(`OK gold21: buy=${entry.buy} sell=${entry.sell}`);
            } else {
              console.log('SKIP gold21: تعذّر قراءة السعر، سيبقى القديم');
            }
          } catch (e) {
            console.log(`ERROR gold21: ${e.message}`);
          }

          if (rates.usd) rates.usdt = { ...rates.usd };

          file.rates = rates;
          file.updatedAt = new Date().toISOString();
          fs.writeFileSync('public/rates.json', JSON.stringify(file, null, 2) + '\n');
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rates.json
          git diff --staged --quiet || git commit -m "chore: update rates.json"
          git pull --rebase origin main
          git push
